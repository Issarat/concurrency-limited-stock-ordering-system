services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: limited_stock
      POSTGRES_USER: limited_stock
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limited_stock -d limited_stock"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
